<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LIYNSZ.OUT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: white;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .profile {
      margin-bottom: 30px;
    }

    .profile-image {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #333;
      margin-bottom: 15px;
    }

    .username {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .description {
      color: #999;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border: 1px solid #292929;
      border-radius: 14px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .link:hover {
      background: #1a1a1a;
      transform: translateY(-2px);
      border-color: #555;
    }

    .featured {
      background: white;
      color: black;
      border-color: white;
    }

    .featured:hover {
      background: #e8e8e8;
      border-color: #e8e8e8;
    }

    footer {
      margin-top: 35px;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="profile">

      <!-- Troque essa imagem depois pela sua -->
      <img
        class="profile-image"
        src="https://via.placeholder.com/200"
        alt="LIYNSZ.OUT"
      >

      <h1 class="username">LIYNSZ.OUT</h1>

      <p class="description">
        MODA MASCULINA • ACHADOS • ESTILO
      </p>

    </section>

    <section class="links">

      <a class="link featured" href="#" target="_blank">
        🛍️ ACHADOS DA SHEIN
      </a>

      <a class="link" href="#" target="_blank">
        📸 INSTAGRAM
      </a>

      <a class="link" href="#" target="_blank">
        🎵 TIKTOK
      </a>

      <a class="link" href="#" target="_blank">
        💬 WHATSAPP
      </a>

    </section>

    <footer>
      LIYNSZ.OUT
    </footer>

  </main>

</body>
</html>
